[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "quill"
version = "0.7.2"
description = "Academic-writing skill for AI agents (Claude Code, Codex, Cursor, Gemini CLI) that learns your writing style, with an optional CLI for review checks and LaTeX manuscripts"
keywords = ["academic-writing", "scientific-writing", "paper-writing", "research-paper", "manuscript", "latex", "agent-skills", "claude-code", "codex", "personalization", "writing-style"]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Sikun Xu" },
]
dependencies = [
  "PyYAML>=6.0.2",
]

[project.urls]
Homepage = "https://github.com/iamsikun/quill"
Repository = "https://github.com/iamsikun/quill"
Changelog = "https://github.com/iamsikun/quill/blob/main/CHANGELOG.md"
Issues = "https://github.com/iamsikun/quill/issues"

[project.scripts]
quill = "quill.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/quill"]

[tool.hatch.build.targets.wheel.force-include]
"skills/quill" = "quill/skill"

[tool.hatch.build.targets.sdist]
include = [
  "/src/quill",
  "/tests",
  "/skills",
  "/evals",
  "/README.md",
  "/docs",
  "/AGENTS.md",
  "/CLAUDE.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/install.sh",
  "/scripts",
  "/.claude-plugin",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
