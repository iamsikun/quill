[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "quill"
version = "0.3.0"
description = "Portable academic writing skill with optional manuscript utilities"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Sikun Xu" },
]
dependencies = [
  "PyYAML>=6.0.2",
]

[project.scripts]
quill = "quill.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/quill"]

[tool.hatch.build.targets.wheel.force-include]
"skills/quill" = "quill/skill"

[tool.hatch.build.targets.sdist]
include = [
  "/src/quill",
  "/tests",
  "/skills",
  "/evals",
  "/README.md",
  "/AGENTS.md",
  "/CLAUDE.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/install.sh",
  "/scripts",
  "/.claude-plugin",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
